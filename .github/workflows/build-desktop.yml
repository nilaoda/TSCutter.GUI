name: Build and Release

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish GitHub release after build
        required: true
        type: boolean
        default: true

env:
  DOTNET_SDK_VERSION: 11.x
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
  FFMPEG_RUNTIME_WIN_X64_URL: https://github.com/nilaoda/FFmpegSharedLibraries/releases/download/20261123/ffmpeg-runtime-win64-gpl-static-9.0.2.zip
  FFMPEG_RUNTIME_LINUX_X64_URL: https://github.com/nilaoda/FFmpegSharedLibraries/releases/download/20261123/ffmpeg-runtime-linux-x64-gpl-static-9.0.2.zip
  FFMPEG_RUNTIME_OSX_ARM64_URL: https://github.com/nilaoda/FFmpegSharedLibraries/releases/download/20261123/ffmpeg-runtime-osx-arm64-gpl-static-9.0.2.zip
  FFMPEG_RUNTIME_WIN_ARM64_URL: https://github.com/nilaoda/FFmpegSharedLibraries/releases/download/20261123/ffmpeg-runtime-win-arm64-gpl-static-9.0.2.zip
  FFMPEG_RUNTIME_LINUX_ARM64_URL: https://github.com/nilaoda/FFmpegSharedLibraries/releases/download/20261123/ffmpeg-runtime-linux-arm64-gpl-static-9.0.2.zip
  FFMPEG_RUNTIME_OSX_X64_URL: https://github.com/nilaoda/FFmpegSharedLibraries/releases/download/20261123/ffmpeg-runtime-osx-x64-gpl-static-9.0.2.zip
  GRAPHICS_SDK_WIN_X64_URL: https://github.com/nilaoda/AvaloniaNativeLibraries/releases/download/avalonia-11.3.23-20261128/avalonia-native-win-x64-all.zip
  GRAPHICS_SDK_LINUX_X64_URL: https://github.com/nilaoda/AvaloniaNativeLibraries/releases/download/avalonia-11.3.23-20261128/avalonia-native-linux-x64-all.zip
  GRAPHICS_SDK_OSX_ARM64_URL: https://github.com/nilaoda/AvaloniaNativeLibraries/releases/download/avalonia-11.3.23-20261128/avalonia-native-osx-arm64-all.zip
  GRAPHICS_SDK_WIN_ARM64_URL: https://github.com/nilaoda/AvaloniaNativeLibraries/releases/download/avalonia-11.3.23-20261128/avalonia-native-win-arm64-all.zip
  GRAPHICS_SDK_LINUX_ARM64_URL: https://github.com/nilaoda/AvaloniaNativeLibraries/releases/download/avalonia-11.3.23-20261128/avalonia-native-linux-arm64-all.zip
  GRAPHICS_SDK_OSX_X64_URL: https://github.com/nilaoda/AvaloniaNativeLibraries/releases/download/avalonia-11.3.23-20261128/avalonia-native-osx-x64-all.zip

jobs:
  release-info:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      stage: ${{ steps.metadata.outputs.stage }}
      tag: ${{ steps.metadata.outputs.tag }}
      sdk-version: ${{ steps.metadata.outputs.sdk-version }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up dotnet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_SDK_VERSION }}
      - name: Read release metadata
        id: metadata
        shell: bash
        run: |
          dotnet msbuild src/TSCutter.GUI/TSCutter.GUI.csproj -nologo -getProperty:Version,ReleaseStage,ReleaseTag,NETCoreSdkVersion > "$RUNNER_TEMP/release-info.json"
          python3 - <<'PYTHON'
          import json
          import os
          import re

          with open(os.path.join(os.environ["RUNNER_TEMP"], "release-info.json")) as source:
              properties = json.load(source)["Properties"]
          version = properties["Version"]
          stage = properties["ReleaseStage"]
          tag = properties["ReleaseTag"]
          sdk = properties["NETCoreSdkVersion"]
          if not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", version):
              raise ValueError("Release version must contain three numeric components")
          if stage != "Beta" or tag != f"v{version}":
              raise ValueError("Unexpected Beta release metadata")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"version={version}\nstage={stage}\ntag={tag}\nsdk-version={sdk}\n")
          PYTHON

      - name: Generate shared third-party notices
        run: |
          dotnet restore src/TSCutter.GUI/TSCutter.GUI.csproj -r linux-x64 -property:Configuration=Release -property:SelfContained=true -property:PublishAot=false -property:PublishTrimmed=false
          dotnet msbuild src/TSCutter.GUI/TSCutter.GUI.csproj -nologo -target:ResolveFrameworkReferences -property:Configuration=Release -property:RuntimeIdentifier=linux-x64 -property:SelfContained=true -property:PublishAot=false -property:PublishTrimmed=false -getItem:ResolvedRuntimePack > "$RUNNER_TEMP/runtime-packs.json"
          python3 tools/generate_third_party_notices.py --runtime-packs "$RUNNER_TEMP/runtime-packs.json" --output "$RUNNER_TEMP/third-party-notices/THIRD_PARTY_NOTICES.txt"

      - name: Upload shared third-party notices
        uses: actions/upload-artifact@v4
        with:
          name: third-party-notices
          path: ${{ runner.temp }}/third-party-notices/THIRD_PARTY_NOTICES.txt
          if-no-files-found: error
          retention-days: 1

  build-win-x64:
    runs-on: windows-2022
    needs: release-info

    steps:
      - uses: actions/checkout@v4

      - name: Set up dotnet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ needs.release-info.outputs.sdk-version }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download FFmpeg static SDK [win-x64]
        shell: pwsh
        run: |
          $zipPath = Join-Path $env:RUNNER_TEMP 'ffmpeg-static-win-x64.zip'
          Invoke-WebRequest -Uri "$env:FFMPEG_RUNTIME_WIN_X64_URL" -OutFile $zipPath -MaximumRetryCount 5 -RetryIntervalSec 3
          $sdkRoot = Join-Path $env:RUNNER_TEMP 'ffmpeg-static'
          Expand-Archive -LiteralPath $zipPath -DestinationPath $sdkRoot
          "FFMPEG_STATIC_ROOT=$sdkRoot" >> $env:GITHUB_ENV
          "FFMPEG_STATIC_SUPPORT_ROOT=$(Join-Path $env:RUNNER_TEMP 'ffmpeg-static-support')" >> $env:GITHUB_ENV

      - name: Set up MinGW static link support
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-binutils
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-libiconv

      - name: Prepare FFmpeg static libraries
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $mingwRoot = Join-Path $env:MSYS2_LOCATION 'mingw64'
          python -m unittest discover -s tools/ffmpeg-static -p "test_*.py"
          if ($LASTEXITCODE -ne 0) { throw "FFmpeg COFF normalization tests failed." }
          python tools/ffmpeg-static/prepare.py --sdk "$env:FFMPEG_STATIC_ROOT" --mingw "$mingwRoot" --output "$env:FFMPEG_STATIC_SUPPORT_ROOT"
          if ($LASTEXITCODE -ne 0) { throw "FFmpeg static library preparation failed." }
          "MINGW_ROOT=$mingwRoot" >> $env:GITHUB_ENV

      - name: Install zip
        run: |
          choco install zip --no-progress --yes

      - name: Prepare native graphics SDK [win-x64]
        shell: pwsh
        run: |
          $zipPath = Join-Path $env:RUNNER_TEMP 'graphics-static.zip'
          $sdkRoot = Join-Path $env:RUNNER_TEMP 'graphics-static'
          $supportRoot = Join-Path $env:RUNNER_TEMP 'graphics-static-support'
          Invoke-WebRequest -Uri "$env:GRAPHICS_SDK_WIN_X64_URL" -OutFile $zipPath -MaximumRetryCount 5 -RetryIntervalSec 3
          Expand-Archive -LiteralPath $zipPath -DestinationPath $sdkRoot
          python -m unittest discover -s tools/graphics-static -p "test_*.py"
          if ($LASTEXITCODE -ne 0) { throw "Graphics SDK tests failed." }
          python tools/graphics-static/prepare.py --rid win-x64 --sdk "$sdkRoot" --output "$supportRoot"
          if ($LASTEXITCODE -ne 0) { throw "Graphics SDK preparation failed." }

      - name: Publish [win-x64]
        run: |
          cd src/TSCutter.GUI
          dotnet publish -r win-x64 -c Release -o artifact -p:PublishProfile=Static
          if ($LASTEXITCODE -ne 0) { throw "Windows static publish failed." }

      - name: Verify single EXE [win-x64]
        shell: pwsh
        run: |
          python tools/ffmpeg-static/verify.py --executable src/TSCutter.GUI/artifact/TSCutterGUI.exe --objdump "$env:MINGW_ROOT/bin/objdump.exe"
          if ($LASTEXITCODE -ne 0) { throw "Windows static runtime verification failed." }

      - name: Verify static graphics [win-x64]
        shell: pwsh
        run: |
          python tools/graphics-static/verify.py --executable src/TSCutter.GUI/artifact/TSCutterGUI.exe --objdump "$env:MINGW_ROOT/bin/objdump.exe"
          if ($LASTEXITCODE -ne 0) { throw "Windows graphics verification failed." }

      - name: Download third-party notices [win-x64]
        uses: actions/download-artifact@v4
        with:
          name: third-party-notices
          path: src/TSCutter.GUI/artifact

      - name: Package [win-x64]
        run: |
          cd src/TSCutter.GUI/artifact
          zip ../../../TSCutter.GUI_${{ needs.release-info.outputs.stage }}_win-x64_${{ needs.release-info.outputs.version }}.zip TSCutterGUI.exe THIRD_PARTY_NOTICES.txt

      - name: Upload Artifact [win-x64]
        uses: actions/upload-artifact@v4
        with:
          name: TSCutter.GUI_win-x64
          path: TSCutter.GUI_${{ needs.release-info.outputs.stage }}_win-x64_${{ needs.release-info.outputs.version }}.zip
          retention-days: 1

  build-win-arm64:
    runs-on: windows-11-arm
    needs: release-info

    steps:
      - uses: actions/checkout@v4

      - name: Set up dotnet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ needs.release-info.outputs.sdk-version }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download FFmpeg static SDK [win-arm64]
        shell: pwsh
        run: |
          $zipPath = Join-Path $env:RUNNER_TEMP 'ffmpeg-static-win-arm64.zip'
          Invoke-WebRequest -Uri "$env:FFMPEG_RUNTIME_WIN_ARM64_URL" -OutFile $zipPath -MaximumRetryCount 5 -RetryIntervalSec 3
          $sdkRoot = Join-Path $env:RUNNER_TEMP 'ffmpeg-static'
          Expand-Archive -LiteralPath $zipPath -DestinationPath $sdkRoot
          "FFMPEG_STATIC_ROOT=$sdkRoot" >> $env:GITHUB_ENV
          "FFMPEG_STATIC_SUPPORT_ROOT=$(Join-Path $env:RUNNER_TEMP 'ffmpeg-static-support')" >> $env:GITHUB_ENV

      - name: Set up CLANGARM64 static link support
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANGARM64
          release: false
          update: true
          install: >-
            mingw-w64-clang-aarch64-clang
            mingw-w64-clang-aarch64-libc++
            mingw-w64-clang-aarch64-libiconv

      - name: Prepare FFmpeg static libraries
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $clangarm64Root = Join-Path $env:MSYS2_LOCATION 'clangarm64'
          python -m unittest discover -s tools/ffmpeg-static -p "test_*.py"
          if ($LASTEXITCODE -ne 0) { throw "FFmpeg COFF normalization tests failed." }
          python tools/ffmpeg-static/prepare.py --sdk "$env:FFMPEG_STATIC_ROOT" --mingw "$clangarm64Root" --rid win-arm64 --output "$env:FFMPEG_STATIC_SUPPORT_ROOT"
          if ($LASTEXITCODE -ne 0) { throw "FFmpeg static library preparation failed." }

      - name: Install zip
        run: |
          choco install zip --no-progress --yes

      - name: Prepare native graphics SDK [win-arm64]
        shell: pwsh
        run: |
          $zipPath = Join-Path $env:RUNNER_TEMP 'graphics-static.zip'
          $sdkRoot = Join-Path $env:RUNNER_TEMP 'graphics-static'
          $supportRoot = Join-Path $env:RUNNER_TEMP 'graphics-static-support'
          Invoke-WebRequest -Uri "$env:GRAPHICS_SDK_WIN_ARM64_URL" -OutFile $zipPath -MaximumRetryCount 5 -RetryIntervalSec 3
          Expand-Archive -LiteralPath $zipPath -DestinationPath $sdkRoot
          python -m unittest discover -s tools/graphics-static -p "test_*.py"
          if ($LASTEXITCODE -ne 0) { throw "Graphics SDK tests failed." }
          python tools/graphics-static/prepare.py --rid win-arm64 --sdk "$sdkRoot" --output "$supportRoot"
          if ($LASTEXITCODE -ne 0) { throw "Graphics SDK preparation failed." }

      - name: Publish [win-arm64]
        run: |
          cd src/TSCutter.GUI
          dotnet publish -r win-arm64 -c Release -o artifact -p:PublishProfile=Static
          if ($LASTEXITCODE -ne 0) { throw "Windows ARM64 static publish failed." }

      - name: Verify single EXE [win-arm64]
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $readobj = Join-Path $env:MSYS2_LOCATION 'clangarm64/bin/llvm-readobj.exe'
          python tools/ffmpeg-static/verify.py --executable src/TSCutter.GUI/artifact/TSCutterGUI.exe --readobj "$readobj"
          if ($LASTEXITCODE -ne 0) { throw "Windows ARM64 static runtime verification failed." }

      - name: Verify static graphics [win-arm64]
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $objdump = Join-Path $env:MSYS2_LOCATION 'clangarm64/bin/objdump.exe'
          python tools/graphics-static/verify.py --executable src/TSCutter.GUI/artifact/TSCutterGUI.exe --objdump "$objdump"
          if ($LASTEXITCODE -ne 0) { throw "Windows ARM64 graphics verification failed." }

      - name: Download third-party notices [win-arm64]
        uses: actions/download-artifact@v4
        with:
          name: third-party-notices
          path: src/TSCutter.GUI/artifact

      - name: Package [win-arm64]
        run: |
          cd src/TSCutter.GUI/artifact
          zip ../../../TSCutter.GUI_${{ needs.release-info.outputs.stage }}_win-arm64_${{ needs.release-info.outputs.version }}.zip TSCutterGUI.exe THIRD_PARTY_NOTICES.txt

      - name: Upload Artifact [win-arm64]
        uses: actions/upload-artifact@v4
        with:
          name: TSCutter.GUI_win-arm64
          path: TSCutter.GUI_${{ needs.release-info.outputs.stage }}_win-arm64_${{ needs.release-info.outputs.version }}.zip
          retention-days: 1

  build-linux-x64:
    # Build the FFmpeg static SDK on Ubuntu 24.04 or older as well.
    runs-on: ubuntu-24.04
    needs: release-info

    steps:
      - run: sudo apt-get update
      - run: sudo apt-get install -y build-essential clang binutils pkg-config curl wget unzip libicu-dev libcurl4-openssl-dev zlib1g-dev libkrb5-dev zip
      - uses: actions/checkout@v4

      - name: Set up dotnet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ needs.release-info.outputs.sdk-version }}

      - name: Prepare FFmpeg static SDK [linux-x64]
        run: |
          curl --fail --location --retry 5 --retry-delay 3 --connect-timeout 30 "$FFMPEG_RUNTIME_LINUX_X64_URL" -o "$RUNNER_TEMP/ffmpeg-static.zip"
          unzip -q "$RUNNER_TEMP/ffmpeg-static.zip" -d "$RUNNER_TEMP/ffmpeg-static"
          python3 -m unittest discover -s tools/ffmpeg-static -p 'test_*.py'
          python3 tools/ffmpeg-static/prepare.py --sdk "$RUNNER_TEMP/ffmpeg-static" --output "$RUNNER_TEMP/ffmpeg-static-support"

      - name: Prepare native graphics SDK [linux-x64]
        run: |
          curl --fail --location --retry 5 --retry-delay 3 --connect-timeout 30 "$GRAPHICS_SDK_LINUX_X64_URL" -o "$RUNNER_TEMP/graphics-static.zip"
          unzip -q "$RUNNER_TEMP/graphics-static.zip" -d "$RUNNER_TEMP/graphics-static"
          python3 -m unittest discover -s tools/graphics-static -p 'test_*.py'
          python3 tools/graphics-static/prepare.py --rid linux-x64 --sdk "$RUNNER_TEMP/graphics-static" --output "$RUNNER_TEMP/graphics-static-support" --ffmpeg-sdk "$RUNNER_TEMP/ffmpeg-static"

      - name: Publish [linux-x64]
        run: |
          dotnet publish src/TSCutter.GUI -r linux-x64 -c Release -o artifact -p:PublishProfile=Static
          test ! -e artifact/libtscutter_audio.so

      - name: Verify FFmpeg static runtime [linux-x64]
        run: python3 tools/ffmpeg-static/verify.py --executable artifact/TSCutterGUI --sdk "$RUNNER_TEMP/ffmpeg-static"

      - name: Verify static graphics [linux-x64]
        run: python3 tools/graphics-static/verify.py --executable artifact/TSCutterGUI

      - name: Download third-party notices [linux-x64]
        uses: actions/download-artifact@v4
        with:
          name: third-party-notices
          path: artifact

      - name: Package [linux-x64]
        run: |
          cd artifact
          zip -r ../TSCutter.GUI_${{ needs.release-info.outputs.stage }}_linux-x64_${{ needs.release-info.outputs.version }}.zip . -x "*.dbg"

      - name: Upload Artifact [linux-x64]
        uses: actions/upload-artifact@v4
        with:
          name: TSCutter.GUI_linux-x64
          path: TSCutter.GUI_${{ needs.release-info.outputs.stage }}_linux-x64_${{ needs.release-info.outputs.version }}.zip
          retention-days: 1

  build-linux-arm64:
    # Build the FFmpeg static SDK on Ubuntu 24.04 or older as well.
    runs-on: ubuntu-24.04-arm
    needs: release-info

    steps:
      - run: sudo apt-get update
      - run: sudo apt-get install -y build-essential clang binutils pkg-config curl wget unzip libicu-dev libcurl4-openssl-dev zlib1g-dev libkrb5-dev zip
      - uses: actions/checkout@v4

      - name: Set up dotnet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ needs.release-info.outputs.sdk-version }}

      - name: Prepare FFmpeg static SDK [linux-arm64]
        run: |
          curl --fail --location --retry 5 --retry-delay 3 --connect-timeout 30 "$FFMPEG_RUNTIME_LINUX_ARM64_URL" -o "$RUNNER_TEMP/ffmpeg-static.zip"
          unzip -q "$RUNNER_TEMP/ffmpeg-static.zip" -d "$RUNNER_TEMP/ffmpeg-static"
          python3 -m unittest discover -s tools/ffmpeg-static -p 'test_*.py'
          python3 tools/ffmpeg-static/prepare.py --sdk "$RUNNER_TEMP/ffmpeg-static" --output "$RUNNER_TEMP/ffmpeg-static-support"

      - name: Prepare native graphics SDK [linux-arm64]
        run: |
          curl --fail --location --retry 5 --retry-delay 3 --connect-timeout 30 "$GRAPHICS_SDK_LINUX_ARM64_URL" -o "$RUNNER_TEMP/graphics-static.zip"
          unzip -q "$RUNNER_TEMP/graphics-static.zip" -d "$RUNNER_TEMP/graphics-static"
          python3 -m unittest discover -s tools/graphics-static -p 'test_*.py'
          python3 tools/graphics-static/prepare.py --rid linux-arm64 --sdk "$RUNNER_TEMP/graphics-static" --output "$RUNNER_TEMP/graphics-static-support" --ffmpeg-sdk "$RUNNER_TEMP/ffmpeg-static"

      - name: Publish [linux-arm64]
        run: |
          dotnet publish src/TSCutter.GUI -r linux-arm64 -c Release -o artifact -p:PublishProfile=Static
          test ! -e artifact/libtscutter_audio.so

      - name: Verify FFmpeg static runtime [linux-arm64]
        run: python3 tools/ffmpeg-static/verify.py --executable artifact/TSCutterGUI --sdk "$RUNNER_TEMP/ffmpeg-static"

      - name: Verify static graphics [linux-arm64]
        run: python3 tools/graphics-static/verify.py --executable artifact/TSCutterGUI

      - name: Download third-party notices [linux-arm64]
        uses: actions/download-artifact@v4
        with:
          name: third-party-notices
          path: artifact

      - name: Package [linux-arm64]
        run: |
          cd artifact
          zip -r ../TSCutter.GUI_${{ needs.release-info.outputs.stage }}_linux-arm64_${{ needs.release-info.outputs.version }}.zip . -x "*.dbg"

      - name: Upload Artifact [linux-arm64]
        uses: actions/upload-artifact@v4
        with:
          name: TSCutter.GUI_linux-arm64
          path: TSCutter.GUI_${{ needs.release-info.outputs.stage }}_linux-arm64_${{ needs.release-info.outputs.version }}.zip
          retention-days: 1

  build-mac-arm64:
    runs-on: macos-15
    needs: release-info
    env:
      MACOSX_DEPLOYMENT_TARGET: "14.0"

    steps:
      - uses: actions/checkout@v4

      - name: Set up dotnet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ needs.release-info.outputs.sdk-version }}

      - name: Prepare FFmpeg static SDK [osx-arm64]
        run: |
          brew install pkgconf
          curl --fail --location --retry 5 --retry-delay 3 --connect-timeout 30 "$FFMPEG_RUNTIME_OSX_ARM64_URL" -o "$RUNNER_TEMP/ffmpeg-static.zip"
          unzip -q "$RUNNER_TEMP/ffmpeg-static.zip" -d "$RUNNER_TEMP/ffmpeg-static"
          python3 -m unittest discover -s tools/ffmpeg-static -p 'test_*.py'
          python3 tools/ffmpeg-static/prepare.py --sdk "$RUNNER_TEMP/ffmpeg-static" --output "$RUNNER_TEMP/ffmpeg-static-support"

      - name: Prepare native graphics SDK [osx-arm64]
        run: |
          curl --fail --location --retry 5 --retry-delay 3 --connect-timeout 30 "$GRAPHICS_SDK_OSX_ARM64_URL" -o "$RUNNER_TEMP/graphics-static.zip"
          unzip -q "$RUNNER_TEMP/graphics-static.zip" -d "$RUNNER_TEMP/graphics-static"
          python3 -m unittest discover -s tools/graphics-static -p 'test_*.py'
          python3 tools/graphics-static/prepare.py --rid osx-arm64 --sdk "$RUNNER_TEMP/graphics-static" --output "$RUNNER_TEMP/graphics-static-support" --ffmpeg-sdk "$RUNNER_TEMP/ffmpeg-static"

      - name: Publish [osx-arm64]
        run: |
          dotnet publish src/TSCutter.GUI -r osx-arm64 -c Release -o artifact -p:PublishProfile=Static
          test ! -e artifact/libtscutter_audio.dylib

      - name: Verify FFmpeg static runtime [osx-arm64]
        run: python3 tools/ffmpeg-static/verify.py --executable artifact/TSCutterGUI --sdk "$RUNNER_TEMP/ffmpeg-static"

      - name: Assemble .app [osx-arm64]
        run: |
          APP_NAME="TSCutter.GUI.app"
          APP_ROOT="$RUNNER_TEMP/$APP_NAME"
          CONTENTS_DIR="$APP_ROOT/Contents"
          MACOS_DIR="$CONTENTS_DIR/MacOS"
          RESOURCES_DIR="$CONTENTS_DIR/Resources"
          ICON_SOURCE="$GITHUB_WORKSPACE/src/TSCutter.GUI/Assets/logo.icns"
          APP_VERSION="${{ needs.release-info.outputs.version }}"

          rm -rf "$APP_ROOT"
          mkdir -p "$MACOS_DIR" "$RESOURCES_DIR"

          cp -R artifact/. "$MACOS_DIR/"
          find "$MACOS_DIR" -maxdepth 1 -name '*.dSYM' -prune -exec rm -rf {} +

          cp "$ICON_SOURCE" "$RESOURCES_DIR/logo.icns"

          cat > "$CONTENTS_DIR/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleDevelopmentRegion</key>
            <string>en</string>
            <key>CFBundleDisplayName</key>
            <string>TSCutter.GUI</string>
            <key>CFBundleExecutable</key>
            <string>TSCutterGUI</string>
            <key>CFBundleIconFile</key>
            <string>logo.icns</string>
            <key>CFBundleIdentifier</key>
            <string>com.nilaoda.tscuttergui</string>
            <key>CFBundleInfoDictionaryVersion</key>
            <string>6.0</string>
            <key>CFBundleName</key>
            <string>TSCutter.GUI</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>$APP_VERSION</string>
            <key>CFBundleVersion</key>
            <string>${{ needs.release-info.outputs.version }}</string>
            <key>LSMinimumSystemVersion</key>
            <string>$MACOSX_DEPLOYMENT_TARGET</string>
            <key>NSHighResolutionCapable</key>
            <true/>
          </dict>
          </plist>
          EOF

      - name: Verify static graphics [osx-arm64]
        run: python3 tools/graphics-static/verify.py --executable artifact/TSCutterGUI

      - name: Download third-party notices [osx-arm64]
        uses: actions/download-artifact@v4
        with:
          name: third-party-notices
          path: ${{ runner.temp }}/TSCutter.GUI.app/Contents/MacOS

      - name: Package [osx-arm64]
        run: |
          cd "$RUNNER_TEMP"
          ditto -c -k --sequesterRsrc --keepParent "TSCutter.GUI.app" "$GITHUB_WORKSPACE/TSCutter.GUI_${{ needs.release-info.outputs.stage }}_osx-arm64_${{ needs.release-info.outputs.version }}.zip"

      - name: Upload Artifact [osx-arm64]
        uses: actions/upload-artifact@v4
        with:
          name: TSCutter.GUI_osx-arm64
          path: TSCutter.GUI_${{ needs.release-info.outputs.stage }}_osx-arm64_${{ needs.release-info.outputs.version }}.zip
          retention-days: 1

  build-mac-x64:
    runs-on: macos-15-intel
    needs: release-info
    env:
      MACOSX_DEPLOYMENT_TARGET: "14.0"

    steps:
      - uses: actions/checkout@v4

      - name: Set up dotnet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ needs.release-info.outputs.sdk-version }}

      - name: Prepare FFmpeg static SDK [osx-x64]
        run: |
          brew install pkgconf
          curl --fail --location --retry 5 --retry-delay 3 --connect-timeout 30 "$FFMPEG_RUNTIME_OSX_X64_URL" -o "$RUNNER_TEMP/ffmpeg-static.zip"
          unzip -q "$RUNNER_TEMP/ffmpeg-static.zip" -d "$RUNNER_TEMP/ffmpeg-static"
          python3 -m unittest discover -s tools/ffmpeg-static -p 'test_*.py'
          python3 tools/ffmpeg-static/prepare.py --sdk "$RUNNER_TEMP/ffmpeg-static" --output "$RUNNER_TEMP/ffmpeg-static-support"

      - name: Prepare native graphics SDK [osx-x64]
        run: |
          curl --fail --location --retry 5 --retry-delay 3 --connect-timeout 30 "$GRAPHICS_SDK_OSX_X64_URL" -o "$RUNNER_TEMP/graphics-static.zip"
          unzip -q "$RUNNER_TEMP/graphics-static.zip" -d "$RUNNER_TEMP/graphics-static"
          python3 -m unittest discover -s tools/graphics-static -p 'test_*.py'
          python3 tools/graphics-static/prepare.py --rid osx-x64 --sdk "$RUNNER_TEMP/graphics-static" --output "$RUNNER_TEMP/graphics-static-support" --ffmpeg-sdk "$RUNNER_TEMP/ffmpeg-static"

      - name: Publish [osx-x64]
        run: |
          dotnet publish src/TSCutter.GUI -r osx-x64 -c Release -o artifact -p:PublishProfile=Static
          test ! -e artifact/libtscutter_audio.dylib

      - name: Verify FFmpeg static runtime [osx-x64]
        run: python3 tools/ffmpeg-static/verify.py --executable artifact/TSCutterGUI --sdk "$RUNNER_TEMP/ffmpeg-static"

      - name: Assemble .app [osx-x64]
        run: |
          APP_NAME="TSCutter.GUI.app"
          APP_ROOT="$RUNNER_TEMP/$APP_NAME"
          CONTENTS_DIR="$APP_ROOT/Contents"
          MACOS_DIR="$CONTENTS_DIR/MacOS"
          RESOURCES_DIR="$CONTENTS_DIR/Resources"
          ICON_SOURCE="$GITHUB_WORKSPACE/src/TSCutter.GUI/Assets/logo.icns"
          APP_VERSION="${{ needs.release-info.outputs.version }}"

          rm -rf "$APP_ROOT"
          mkdir -p "$MACOS_DIR" "$RESOURCES_DIR"

          cp -R artifact/. "$MACOS_DIR/"
          find "$MACOS_DIR" -maxdepth 1 -name '*.dSYM' -prune -exec rm -rf {} +

          cp "$ICON_SOURCE" "$RESOURCES_DIR/logo.icns"

          cat > "$CONTENTS_DIR/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleDevelopmentRegion</key>
            <string>en</string>
            <key>CFBundleDisplayName</key>
            <string>TSCutter.GUI</string>
            <key>CFBundleExecutable</key>
            <string>TSCutterGUI</string>
            <key>CFBundleIconFile</key>
            <string>logo.icns</string>
            <key>CFBundleIdentifier</key>
            <string>com.nilaoda.tscuttergui</string>
            <key>CFBundleInfoDictionaryVersion</key>
            <string>6.0</string>
            <key>CFBundleName</key>
            <string>TSCutter.GUI</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>$APP_VERSION</string>
            <key>CFBundleVersion</key>
            <string>${{ needs.release-info.outputs.version }}</string>
            <key>LSMinimumSystemVersion</key>
            <string>$MACOSX_DEPLOYMENT_TARGET</string>
            <key>NSHighResolutionCapable</key>
            <true/>
          </dict>
          </plist>
          EOF

      - name: Verify static graphics [osx-x64]
        run: python3 tools/graphics-static/verify.py --executable "$RUNNER_TEMP/TSCutter.GUI.app/Contents/MacOS/TSCutterGUI"

      - name: Download third-party notices [osx-x64]
        uses: actions/download-artifact@v4
        with:
          name: third-party-notices
          path: ${{ runner.temp }}/TSCutter.GUI.app/Contents/MacOS

      - name: Package [osx-x64]
        run: |
          cd "$RUNNER_TEMP"
          ditto -c -k --sequesterRsrc --keepParent "TSCutter.GUI.app" "$GITHUB_WORKSPACE/TSCutter.GUI_${{ needs.release-info.outputs.stage }}_osx-x64_${{ needs.release-info.outputs.version }}.zip"

      - name: Upload Artifact [osx-x64]
        uses: actions/upload-artifact@v4
        with:
          name: TSCutter.GUI_osx-x64
          path: TSCutter.GUI_${{ needs.release-info.outputs.stage }}_osx-x64_${{ needs.release-info.outputs.version }}.zip
          retention-days: 1

  release:
    if: ${{ github.event.inputs.publish_release != 'false' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    needs: [build-win-x64, build-win-arm64, build-linux-x64, build-linux-arm64, build-mac-arm64, build-mac-x64, release-info]

    steps:
      - name: Fetch artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: TSCutter.GUI_*

      - name: Generate update manifest
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import hashlib
          import json
          import os

          root = os.environ["GITHUB_WORKSPACE"]
          version = "${{ needs.release-info.outputs.version }}"
          tag = "${{ needs.release-info.outputs.tag }}"
          rids = ["win-x64", "win-arm64", "linux-x64", "linux-arm64", "osx-arm64", "osx-x64"]
          assets = {}
          sums = []
          for rid in rids:
              folder = os.path.join(root, "TSCutter.GUI_" + rid)
              packages = [name for name in os.listdir(folder) if name.endswith(".zip")]
              if len(packages) != 1:
                  raise RuntimeError("Expected exactly one package in " + folder)
              name = packages[0]
              path = os.path.join(folder, name)
              with open(path, "rb") as source:
                  digest = hashlib.sha256(source.read()).hexdigest()
              assets[rid] = {"file": name, "size": os.path.getsize(path), "sha256": digest}
              sums.append(digest + "  " + name)
          manifest = {
              "version": version,
              "tag": tag,
              "releaseNotesUrl": "https://github.com/nilaoda/TSCutter.GUI/releases/tag/" + tag,
              "assets": assets,
          }
          with open(os.path.join(root, "update-manifest.json"), "w", encoding="utf-8") as target:
              json.dump(manifest, target, indent=2)
              target.write("\n")
          with open(os.path.join(root, "SHA256SUMS.txt"), "w", encoding="utf-8") as target:
              target.write("\n".join(sums) + "\n")
          PYTHON

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ needs.release-info.outputs.tag }}
          commit: ${{ github.sha }}
          name: ${{ needs.release-info.outputs.stage }} ${{ needs.release-info.outputs.version }}
          artifacts: "TSCutter.GUI_linux-x64/*,TSCutter.GUI_linux-arm64/*,TSCutter.GUI_osx-arm64/*,TSCutter.GUI_osx-x64/*,TSCutter.GUI_win-x64/*,TSCutter.GUI_win-arm64/*,update-manifest.json,SHA256SUMS.txt"
          draft: false
          prerelease: false
          makeLatest: true
          allowUpdates: false
          generateReleaseNotes: true
