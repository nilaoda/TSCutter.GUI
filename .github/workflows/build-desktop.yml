name: Build and Release

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish GitHub release after build
        required: true
        type: boolean
        default: true

env:
  DOTNET_SDK_VERSION: 10.x
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
  FFMPEG_RUNTIME_WIN_X64_URL: https://github.com/nilaoda/FFmpegSharedLibraries/releases/download/20261004/ffmpeg-runtime-win64-gpl-shared-9.0.2.zip
  FFMPEG_RUNTIME_LINUX_X64_URL: https://github.com/nilaoda/FFmpegSharedLibraries/releases/download/20261004/ffmpeg-runtime-linux-x64-gpl-shared-9.0.2.zip
  FFMPEG_RUNTIME_OSX_ARM64_URL: https://github.com/nilaoda/FFmpegSharedLibraries/releases/download/20261004/ffmpeg-runtime-osx-arm64-gpl-shared-9.0.2.zip

jobs:
  release-info:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      stage: ${{ steps.metadata.outputs.stage }}
      tag: ${{ steps.metadata.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up dotnet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_SDK_VERSION }}
      - name: Read release metadata
        id: metadata
        shell: bash
        run: |
          dotnet msbuild src/TSCutter.GUI/TSCutter.GUI.csproj -nologo -getProperty:Version,ReleaseStage,ReleaseTag > "$RUNNER_TEMP/release-info.json"
          python3 - <<'PYTHON'
          import json
          import os
          import re

          with open(os.path.join(os.environ["RUNNER_TEMP"], "release-info.json")) as source:
              properties = json.load(source)["Properties"]
          version = properties["Version"]
          stage = properties["ReleaseStage"]
          tag = properties["ReleaseTag"]
          if not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", version):
              raise ValueError("Release version must contain three numeric components")
          if stage != "Beta" or tag != f"v{version}":
              raise ValueError("Unexpected Beta release metadata")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"version={version}\nstage={stage}\ntag={tag}\n")
          PYTHON

  build-win-x64:
    runs-on: windows-latest
    needs: release-info

    steps:
      - uses: actions/checkout@v4

      - name: Set up dotnet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_SDK_VERSION }}

      - name: Install 7zip and zip
        run: |
          choco install 7zip --no-progress --yes
          choco install zip --no-progress --yes

      - name: Download ANGLE.Static
        run: |
          cd src/TSCutter.GUI/lib
          curl -L https://github.com/2ndlab/ANGLE.Static/releases/download/v1.1.0/av_libglesv2-10.0.22621.0.7z -o angle.7z
          7z x angle.7z

      - name: Download SkiaSharp.Static (HarfBuzz)
        run: |
          cd src/TSCutter.GUI/lib
          curl -L https://github.com/2ndlab/SkiaSharp.Static/releases/download/v1.0.0/libHarfBuzzSharp.zip -o harfbuzz.zip
          unzip -o harfbuzz.zip -d .
          7z x libHarfBuzzSharp.7z

      - name: Download SkiaSharp.Static (SkiaSharp)
        run: |
          cd src/TSCutter.GUI/lib
          curl -L https://github.com/2ndlab/SkiaSharp.Static/releases/download/v1.0.0/libSkiaSharp.zip -o skiasharp.zip
          unzip -o skiasharp.zip -d .
          7z x libSkiaSharp.7z

      - name: Publish [win-x64]
        run: | 
          cd src/TSCutter.GUI
          dotnet publish -r win-x64 -c Release -o artifact

      - name: Download FFmpeg Runtime [win-x64]
        shell: pwsh
        run: |
          $zipPath = Join-Path $env:RUNNER_TEMP "ffmpeg-runtime-win-x64.zip"
          Invoke-WebRequest -Uri "${{ env.FFMPEG_RUNTIME_WIN_X64_URL }}" -OutFile $zipPath
          Expand-Archive -Path $zipPath -DestinationPath "src/TSCutter.GUI/artifact" -Force

      - name: Package [win-x64]
        run: |
          cd src/TSCutter.GUI/artifact
          zip -r ../../../TSCutter.GUI_${{ needs.release-info.outputs.stage }}_win-x64_${{ needs.release-info.outputs.version }}.zip . -x "lib*" -x "av_*" -x "*.pdb"

      - name: Upload Artifact [win-x64]
        uses: actions/upload-artifact@v4
        with:
          name: TSCutter.GUI_win-x64
          path: TSCutter.GUI_${{ needs.release-info.outputs.stage }}_win-x64_${{ needs.release-info.outputs.version }}.zip
          retention-days: 1

  build-linux-x64:
    runs-on: ubuntu-latest
    needs: release-info

    steps:
      - run: sudo apt-get update
      - run: sudo apt-get install -y curl wget unzip libicu-dev libcurl4-openssl-dev zlib1g-dev libkrb5-dev zip
      - uses: actions/checkout@v4

      - name: Set up dotnet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_SDK_VERSION }}

      - name: Publish [linux-x64]
        run: dotnet publish src/TSCutter.GUI -r linux-x64 -c Release -o artifact

      - name: Download FFmpeg Runtime [linux-x64]
        run: |
          curl -L "${{ env.FFMPEG_RUNTIME_LINUX_X64_URL }}" -o "$RUNNER_TEMP/ffmpeg-runtime-linux-x64.zip"
          unzip -o "$RUNNER_TEMP/ffmpeg-runtime-linux-x64.zip" -d artifact

      - name: Package [linux-x64]
        run: |
          cd artifact
          zip -r ../TSCutter.GUI_${{ needs.release-info.outputs.stage }}_linux-x64_${{ needs.release-info.outputs.version }}.zip . -x "*.dbg"

      - name: Upload Artifact [linux-x64]
        uses: actions/upload-artifact@v4
        with:
          name: TSCutter.GUI_linux-x64
          path: TSCutter.GUI_${{ needs.release-info.outputs.stage }}_linux-x64_${{ needs.release-info.outputs.version }}.zip
          retention-days: 1

  build-mac-arm64:
    runs-on: macos-14
    needs: release-info

    steps:
      - uses: actions/checkout@v4

      - name: Set up dotnet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_SDK_VERSION }}

      - name: Publish [osx-arm64]
        run: dotnet publish src/TSCutter.GUI -r osx-arm64 -c Release -o artifact

      - name: Assemble .app [osx-arm64]
        run: |
          APP_NAME="TSCutter.GUI.app"
          APP_ROOT="$RUNNER_TEMP/$APP_NAME"
          CONTENTS_DIR="$APP_ROOT/Contents"
          MACOS_DIR="$CONTENTS_DIR/MacOS"
          RESOURCES_DIR="$CONTENTS_DIR/Resources"
          ICON_SOURCE="$GITHUB_WORKSPACE/src/TSCutter.GUI/Assets/logo.png"
          APP_VERSION="${{ needs.release-info.outputs.version }}"

          rm -rf "$APP_ROOT"
          mkdir -p "$MACOS_DIR" "$RESOURCES_DIR"

          cp -R artifact/. "$MACOS_DIR/"
          curl -L "${{ env.FFMPEG_RUNTIME_OSX_ARM64_URL }}" -o "$RUNNER_TEMP/ffmpeg-runtime-osx-arm64.zip"
          unzip -o "$RUNNER_TEMP/ffmpeg-runtime-osx-arm64.zip" -d "$MACOS_DIR"
          find "$MACOS_DIR" -maxdepth 1 -name '*.dSYM' -prune -exec rm -rf {} +

          sips -s format icns "$ICON_SOURCE" --out "$RESOURCES_DIR/logo.icns" >/dev/null

          cat > "$CONTENTS_DIR/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleDevelopmentRegion</key>
            <string>en</string>
            <key>CFBundleDisplayName</key>
            <string>TSCutter.GUI</string>
            <key>CFBundleExecutable</key>
            <string>TSCutterGUI</string>
            <key>CFBundleIconFile</key>
            <string>logo.icns</string>
            <key>CFBundleIdentifier</key>
            <string>com.nilaoda.tscuttergui</string>
            <key>CFBundleInfoDictionaryVersion</key>
            <string>6.0</string>
            <key>CFBundleName</key>
            <string>TSCutter.GUI</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>$APP_VERSION</string>
            <key>CFBundleVersion</key>
            <string>${{ needs.release-info.outputs.version }}</string>
            <key>LSMinimumSystemVersion</key>
            <string>13.0</string>
            <key>NSHighResolutionCapable</key>
            <true/>
          </dict>
          </plist>
          EOF

      - name: Package [osx-arm64]
        run: |
          cd "$RUNNER_TEMP"
          ditto -c -k --sequesterRsrc --keepParent "TSCutter.GUI.app" "$GITHUB_WORKSPACE/TSCutter.GUI_${{ needs.release-info.outputs.stage }}_osx-arm64_${{ needs.release-info.outputs.version }}.zip"

      - name: Upload Artifact [osx-arm64]
        uses: actions/upload-artifact@v4
        with:
          name: TSCutter.GUI_osx-arm64
          path: TSCutter.GUI_${{ needs.release-info.outputs.stage }}_osx-arm64_${{ needs.release-info.outputs.version }}.zip
          retention-days: 1

  release:
    if: ${{ github.event.inputs.publish_release != 'false' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs: [build-win-x64, build-linux-x64, build-mac-arm64, release-info]

    steps:
      - name: Fetch artifacts
        uses: actions/download-artifact@v4

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ needs.release-info.outputs.tag }}
          commit: ${{ github.sha }}
          name: ${{ needs.release-info.outputs.stage }} ${{ needs.release-info.outputs.version }}
          artifacts: "TSCutter.GUI_linux-x64/*,TSCutter.GUI_osx-arm64/*,TSCutter.GUI_win-x64/*"
          draft: false
          prerelease: false
          makeLatest: true
          allowUpdates: false
          generateReleaseNotes: true
