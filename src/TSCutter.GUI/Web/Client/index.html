<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TSCutter.GUI</title>
    <link rel="stylesheet" href="/remote.css">
    <link id="appearance" rel="stylesheet" href="/appearance.css">
    <script src="/video-playback.js" defer></script>
    <script src="/touchpad.js" defer></script>
    <script src="/viewport.js" defer></script>
    <script src="/remote.js" defer></script>
</head>
<body>
    <main>
        <form id="access" hidden>
            <h1>TSCutter.GUI</h1>
            <p id="login-hint" hidden></p>
            <div id="account-fields" hidden>
                <label for="username" id="username-label"></label>
                <input id="username" name="username" autocomplete="username" maxlength="32" autocapitalize="none" spellcheck="false">
                <label for="password" id="password-label"></label>
                <input id="password" name="password" type="password" autocomplete="current-password" maxlength="128">
            </div>
            <div id="pair-fields">
                <label for="pair-code" id="pair-code-label"></label>
                <input id="pair-code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" required>
                <label id="browser-name-setting">
                    <span id="browser-name-label"></span>
                    <input id="browser-name" type="text" maxlength="48" autocomplete="off">
                </label>
            </div>
            <button id="connect" type="submit"></button>
            <button id="reconnect" type="button" hidden></button>
        </form>
        <p id="status" role="status" hidden></p>
        <section id="workspace" aria-label="TSCutter.GUI" hidden>
            <div id="stage" tabindex="0">
                <canvas id="desktop" width="1280" height="800" aria-label="Remote editing workspace"></canvas>
                <video id="stream-video" autoplay muted playsinline disableremoteplayback hidden></video>
                <span id="touchpad-cursor" aria-hidden="true" hidden>
                    <svg viewBox="0 0 24 24" focusable="false">
                        <path class="cursor-arrow" d="M2 2 L20 14 L12 15 L16 21 L12 23 L8 17 L2 22 Z"/>
                        <path class="cursor-pointer" d="M9 12 V3 A2 2 0 0 1 13 3 V9 C14 8 16 9 16 10 C17 9 19 10 19 11 C21 10 22 12 22 14 L21 19 L18 23 H10 L4 16 C2 13 5 11 7 13 L9 15 Z"/>
                        <path class="cursor-grab" d="M5 12 V7 Q7 4 9 7 V5 Q11 2 13 5 V6 Q15 3 17 6 V8 Q20 6 21 9 V15 L19 22 H8 L3 16 Q1 12 5 12 Z"/>
                        <path class="cursor-horizontal" d="M1 12 L7 6 V10 H17 V6 L23 12 L17 18 V14 H7 V18 Z"/>
                        <path class="cursor-vertical" d="M12 1 L18 7 H14 V17 H18 L12 23 L6 17 H10 V7 H6 Z"/>
                        <path class="cursor-diagonal" d="M3 3 H12 L9 6 L18 15 L21 12 V21 H12 L15 18 L6 9 L3 12 Z"/>
                        <path class="cursor-move" d="M12 1 L17 6 H14 V10 H18 V7 L23 12 L18 17 V14 H14 V18 H17 L12 23 L7 18 H10 V14 H6 V17 L1 12 L6 7 H10 V6 H7 Z"/>
                        <path class="cursor-text" d="M6 2 H10 L12 4 L14 2 H18 V5 H14 V19 H18 V22 H14 L12 20 L10 22 H6 V19 H10 V5 H6 Z"/>
                        <path class="cursor-crosshair" d="M10 2 H14 V10 H22 V14 H14 V22 H10 V14 H2 V10 H10 Z"/>
                        <g class="cursor-wait"><circle cx="12" cy="12" r="9"/><path d="M12 6 V12 L16 15" fill="none"/></g>
                        <g class="cursor-not-allowed"><circle cx="12" cy="12" r="9"/><path d="M6 6 L18 18" fill="none"/></g>
                        <g class="cursor-badge"><rect x="12" y="13" width="11" height="10" rx="2"/><path class="cursor-copy" d="M15 18 H20 M17.5 15.5 V20.5" fill="none"/><text class="cursor-help" x="15" y="21">?</text></g>
                    </svg>
                </span>
                <span id="touchpad-cursor-hint" class="touchpad-indicator" aria-hidden="true" hidden></span>
                <span id="touchpad-dragging" class="touchpad-indicator" aria-hidden="true"></span>
                <span id="touchpad-scrolling" class="touchpad-indicator" aria-hidden="true"></span>
            </div>
            <svg id="control-symbols" aria-hidden="true" focusable="false" width="0" height="0">
                <symbol id="control-sliders" viewBox="0 0 24 24"><path d="M3 6h7m4 0h7M3 12h13m4 0h1M3 18h2m4 0h12"/><circle cx="12" cy="6" r="2"/><circle cx="18" cy="12" r="2"/><circle cx="7" cy="18" r="2"/></symbol>
                <symbol id="control-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
                <symbol id="control-sound" viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4ZM17 8q5 4 0 8"/></symbol>
                <symbol id="control-keyboard" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 9h1m3 0h1m3 0h2M7 12h1m3 0h1m3 0h2M8 15h8"/></symbol>
                <symbol id="control-fit" viewBox="0 0 24 24"><path d="M9 4H4v5m11-5h5v5M4 15v5h5m11-5v5h-5"/><rect x="8" y="8" width="8" height="8" rx="1"/></symbol>
                <symbol id="control-fullscreen" viewBox="0 0 24 24"><path d="M9 3H3v6m12-6h6v6M3 15v6h6m12-6v6h-6"/></symbol>
                <symbol id="control-pointer" viewBox="0 0 24 24"><path d="m5 3 15 10-7 1-3 7Z"/></symbol>
                <symbol id="control-logout" viewBox="0 0 24 24"><path d="M10 4H4v16h6m-1-8h12m-4-4 4 4-4 4"/></symbol>
            </svg>
            <div id="controls">
                <button id="controls-toggle" type="button" aria-controls="controls-panel" aria-expanded="false" aria-keyshortcuts="Alt+Shift+U">
                    <svg class="control-icon" aria-hidden="true"><use href="#control-sliders"/></svg>
                    <span class="control-label" id="controls-toggle-label"></span>
                </button>
                <div id="controls-panel" role="dialog" aria-labelledby="controls-title" hidden>
                    <div id="controls-grip" aria-hidden="true"></div>
                    <header id="controls-header">
                        <svg class="control-icon" aria-hidden="true"><use href="#control-sliders"/></svg>
                        <h2 id="controls-title"></h2>
                        <button id="controls-close" type="button"><svg class="control-icon" aria-hidden="true"><use href="#control-close"/></svg></button>
                    </header>
                    <div id="controls-tabs" role="tablist" aria-labelledby="controls-title">
                        <button id="controls-picture-tab" type="button" role="tab" aria-controls="controls-picture" aria-selected="true" data-controls-tab="picture"></button>
                        <button id="controls-input-tab" type="button" role="tab" aria-controls="controls-input" aria-selected="false" tabindex="-1" data-controls-tab="input"></button>
                        <button id="controls-connection-tab" type="button" role="tab" aria-controls="controls-connection" aria-selected="false" tabindex="-1" data-controls-tab="connection"></button>
                    </div>
                    <div id="controls-body">
                        <div id="controls-picture" class="controls-page" role="tabpanel" aria-labelledby="controls-picture-tab">
                            <div class="controls-fields">
                                <label id="video-mode-setting" for="video-mode">
                                    <span id="video-mode-label"></span>
                                    <select id="video-mode">
                                        <option value="h264" selected></option>
                                        <option value="av1"></option>
                                        <option value="jpeg">JPEG</option>
                                    </select>
                                </label>
                                <label id="quality-setting" for="quality">
                                    <span id="quality-label"></span>
                                    <select id="quality">
                                        <option value="smooth"></option>
                                        <option value="balanced"></option>
                                        <option value="sharp" selected></option>
                                    </select>
                                </label>
                                <label id="resolution-setting" for="resolution">
                                    <span id="resolution-label"></span>
                                    <select id="resolution" aria-describedby="resolution-hint">
                                        <option value="auto" selected></option>
                                        <option value="720">720p</option>
                                        <option value="1080">1080p</option>
                                        <option value="1440">1440p</option>
                                        <option value="2160">4K (2160p)</option>
                                    </select>
                                </label>
                                <label id="aspect-ratio-setting" for="aspect-ratio">
                                    <span id="aspect-ratio-label"></span>
                                    <select id="aspect-ratio">
                                        <option value="auto" selected></option>
                                        <option value="16:9">16:9</option>
                                    </select>
                                </label>
                            </div>
                            <p id="resolution-hint" class="controls-hint"></p>
                        </div>
                        <div id="controls-input" class="controls-page" role="tabpanel" aria-labelledby="controls-input-tab" hidden>
                            <div id="input-actions">
                                <button id="sound" type="button" aria-pressed="false"><svg class="control-icon" aria-hidden="true"><use href="#control-sound"/></svg><span class="control-label"></span></button>
                                <button id="show-keyboard" type="button" hidden><svg class="control-icon" aria-hidden="true"><use href="#control-keyboard"/></svg><span class="control-label"></span></button>
                                <button id="reset-view" type="button" hidden><svg class="control-icon" aria-hidden="true"><use href="#control-fit"/></svg><span class="control-label"></span></button>
                                <button id="fullscreen" type="button"><svg class="control-icon" aria-hidden="true"><use href="#control-fullscreen"/></svg><span class="control-label"></span></button>
                            </div>
                            <button id="touchpad-toggle" type="button" aria-pressed="false" aria-describedby="touchpad-hint" hidden><svg class="control-icon" aria-hidden="true"><use href="#control-pointer"/></svg><span class="control-label"></span><span class="control-switch" aria-hidden="true"></span></button>
                            <p id="touchpad-hint" class="controls-hint" hidden></p>
                        </div>
                        <div id="controls-connection" class="controls-page" role="tabpanel" aria-labelledby="controls-connection-tab" hidden>
                            <p id="identity" hidden></p>
                            <p id="transport-detail" hidden></p>
                            <button id="retry-video" type="button" hidden></button>
                            <button id="logout" type="button" hidden><svg class="control-icon" aria-hidden="true"><use href="#control-logout"/></svg><span class="control-label"></span></button>
                        </div>
                        <p id="controls-status" role="status" hidden></p>
                    </div>
                    <footer id="controls-footer"><span id="connection-indicator" aria-hidden="true"></span><p id="transport-status" role="status"></p></footer>
                </div>
            </div>
            <textarea id="keyboard" tabindex="-1" aria-label="Remote keyboard" autocapitalize="off" spellcheck="false" inputmode="none" autocomplete="off"></textarea>
        </section>
    </main>
</body>
</html>
